services:
  infinite-canvas:
    build: .
    image: infinite-canvas-v2:latest
    container_name: infinite-canvas-v2
    # 与 Dockerfile 中的 nextjs 用户一致，确保 SQLite/媒体卷可写
    user: "1001:1001"
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      AGNES_API_KEY: ${AGNES_API_KEY}
      ARK_API_KEY: ${ARK_API_KEY:-}
      AGNES_API_BASE_URL: ${AGNES_API_BASE_URL:-https://api.agnes-ai.cn/v1}
      TOS_BUCKET: ${TOS_BUCKET:-devops-dev}
      TOS_PUBLIC_BASE_URL: ${TOS_PUBLIC_BASE_URL:-https://devops-dev.tos-cn-beijing.volces.com}
      TOS_S3_ENDPOINT: ${TOS_S3_ENDPOINT:-tos-cn-beijing.volces.com}
      TOS_ACCESS_KEY_ID: ${TOS_ACCESS_KEY_ID}
      TOS_SECRET_ACCESS_KEY: ${TOS_SECRET_ACCESS_KEY}
    volumes:
      - infinite-canvas-v2-data:/app/data
    restart: unless-stopped

volumes:
  infinite-canvas-v2-data:
